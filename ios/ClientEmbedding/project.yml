name: DshClientEmbedding
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DshClientEmbedding:
    type: application
    platform: iOS
    sources:
      - path: Sample
    preBuildScripts:
      - name: Build MoonBit client archive
        script: "sh \"${PROJECT_DIR}/build-for-xcode.sh\""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "dev.f4ah6o.dsh.client-embedding"
        PRODUCT_NAME: "Dsh Client Embedding"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleDefault"
        SWIFT_OBJC_BRIDGING_HEADER: "$(PROJECT_DIR)/include/dsh_moonbit_client.h"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/include"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../../_build/ios-client/$(PLATFORM_NAME)"
        OTHER_LDFLAGS:
          - "-ldsh_moonbitclient"
          - "-lm"
