name: Publish native release assets

on:
  pull_request:
    paths:
      - ".github/workflows/publish-native.yml"
      - ".github/native-release.json"
      - "docs/releases/**"
      - "scripts/**"
      - "script/**"
      - "cmd/**"
      - "runtime/**"
      - "native/**"
      - "desktop/**"
      - "browser/**"
      - "web/**"
      - "vendor/gpui"
      - "vendor/gpui/**"
      - "**/*.mbt"
      - "**/*.mbtx"
      - "**/moon.pkg"
      - "**/moon.pkg.json"
      - "moon.mod"
      - "moon.work"
      - "moon.lock"
      - ".moonbit-version"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      assets: ${{ steps.plan.outputs.assets }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release scope and plan
        id: plan
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python3 scripts/test-native-release-plan.py
          python3 scripts/native-release-plan.py --event "$RELEASE_EVENT" --ref "$RELEASE_REF" --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev libpango1.0-dev \
            libfontconfig1-dev libgl1-mesa-dri libegl-mesa0 \
            weston xvfb xauth xdotool x11-utils fonts-noto-cjk
      - name: Resolve dependencies
        run: |
          moon update
          moon install
      - name: Build the embedded web UI and dsh CLI executable
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            MACOSX_DEPLOYMENT_TARGET=13.0 sh scripts/build.sh
          else
            sh scripts/build.sh
          fi
      - name: Build the native Linux Wayland desktop and test its payload launcher
        if: runner.os == 'Linux'
        run: |
          sh scripts/build-desktop-linux.sh --build
          DSH_LINUX_DESKTOP_CLI="$PWD/_build/native/release/build/f4ah6o/dsh/cmd/dsh/dsh.exe" python3 scripts/test-linux-desktop-payload.py
          python3 scripts/test-smoke-release-linux.py
      - name: Build and package the macOS app
        if: matrix.platform == 'darwin-aarch64'
        run: |
          sh scripts/build-desktop.sh --build
          sh scripts/package-macos-app.sh _build/macos/Dsh.app release/Dsh-macos-arm64.zip
      - name: Validate the extracted macOS app bundle in hosted CI
        if: matrix.platform == 'darwin-aarch64'
        run: sh scripts/smoke-release-macos.sh --bundle-only release/Dsh-macos-arm64.zip
      - name: Package raw release asset
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = darwin-aarch64 ]; then
            native_build_root=_build/native-macos-13.0/native/release/build
          else
            native_build_root=_build/native/release/build
          fi
          binaries=$(find "$native_build_root" -type f -path '*/cmd/dsh/dsh.exe' -print)
          count=$(printf '%s\n' "$binaries" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            printf 'Expected exactly one dsh.exe, got %s\n' "$count" >&2
            exit 1
          fi
          mkdir -p release
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/package-linux-desktop.py --cli "$binaries" \
              --desktop _build/native/release/build/f4ah6o/dsh/desktop/linux/linux.exe \
              --output "release/dsh-${{ matrix.platform }}"
          else
            sh scripts/package-macos-cli.sh release/Dsh-macos-arm64.zip "release/dsh-${{ matrix.platform }}"
            DSH_MACOS_DESKTOP_CLI="$PWD/release/dsh-${{ matrix.platform }}" python3 scripts/test-macos-desktop-payload.py
          fi
          chmod 755 "release/dsh-${{ matrix.platform }}"
          test -s "release/dsh-${{ matrix.platform }}"
      - name: Smoke test the packaged CLI and embedded browser assets
        run: sh scripts/smoke-release-cli.sh "release/dsh-${{ matrix.platform }}"
      - name: Validate packaged Linux GUI with real compositor input and GPU frames
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-release-linux.py "release/dsh-${{ matrix.platform }}" "_build/linux-gui-evidence"
      - name: Retain Linux native GUI evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui-evidence-${{ matrix.platform }}
          path: _build/linux-gui-evidence/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Publish verified GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_ASSETS: ${{ needs.plan.outputs.assets }}
          RELEASE_NOTES_FILE: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          python3 scripts/native-release-plan.py --event push --ref "$GITHUB_REF_NAME" --verify-assets release
          mapfile -t expected < <(python3 -c 'import json, os; print("\n".join("release/" + name for name in json.loads(os.environ["EXPECTED_ASSETS"])))')
          gh release create "${GITHUB_REF_NAME}" "${expected[@]}" --verify-tag --notes-file "$RELEASE_NOTES_FILE" --title "${GITHUB_REF_NAME}"
