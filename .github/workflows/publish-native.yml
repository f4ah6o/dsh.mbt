name: Publish native release assets


on:
  pull_request:
    paths:
      - "moon.mod"
      - ".github/workflows/publish-native.yml"
      - "scripts/**"
      - "cmd/**"
      - "runtime/**"
      - "native/**"
      - "desktop/**"
      - "browser/**"
      - "web/**"
      - "vendor/gpui"
      - "vendor/gpui/**"
      - "**/*.mbt"
      - "**/*.mbtx"
      - "**/moon.pkg"
      - "**/moon.pkg.json"
      - "moon.work"
      - "moon.lock"
      - ".moonbit-version"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "moon.mod"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release guard unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_version.py' -v
      - name: Detect explicit manifest version change
        id: resolve
        shell: bash
        env:
          RELEASE_KIND: dsh
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          release_tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 scripts/release_version.py check-tag --kind "$RELEASE_KIND" --tag "$GITHUB_REF_NAME"
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            git show "${EVENT_BEFORE}:moon.mod" > "$RUNNER_TEMP/previous-moon.mod"
            release_tag="$(python3 scripts/release_version.py changed --kind "$RELEASE_KIND" --previous-file "$RUNNER_TEMP/previous-moon.mod")"
          else
            python3 scripts/release_version.py read --kind "$RELEASE_KIND"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.event_name == 'pull_request' || needs.prepare.outputs.release_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Resolve dependencies
        run: |
          moon update
          moon install
      - name: Build the embedded web UI and dsh CLI executable
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            MACOSX_DEPLOYMENT_TARGET=13.0 sh scripts/build.sh
          else
            sh scripts/build.sh
          fi
      - name: Package raw release asset
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = darwin-aarch64 ]; then
            native_build_root=_build/native-macos-13.0/native/release/build
          else
            native_build_root=_build/native/release/build
          fi
          binaries=$(find "$native_build_root" -type f -path '*/cmd/dsh/dsh.exe' -print)
          count=$(printf '%s\n' "$binaries" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            printf 'Expected exactly one dsh.exe, got %s\n' "$count" >&2
            exit 1
          fi
          mkdir -p release
          cp "$binaries" "release/dsh-${{ matrix.platform }}"
          chmod 755 "release/dsh-${{ matrix.platform }}"
          test -s "release/dsh-${{ matrix.platform }}"
      - name: Smoke test the packaged CLI and embedded browser assets
        run: sh scripts/smoke-release-cli.sh "release/dsh-${{ matrix.platform }}"
      - name: Build and package the macOS app
        if: matrix.platform == 'darwin-aarch64'
        run: |
          sh scripts/build-desktop.sh --build
          sh scripts/package-macos-app.sh _build/macos/Dsh.app release/Dsh-macos-arm64.zip
      - name: Validate the extracted macOS app bundle in hosted CI
        if: matrix.platform == 'darwin-aarch64'
        run: sh scripts/smoke-release-macos.sh --bundle-only release/Dsh-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && needs.prepare.outputs.release_tag != ''
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Publish verified GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          expected=(
            release/dsh-linux-x86_64
            release/dsh-linux-aarch64
            release/dsh-darwin-aarch64
            release/Dsh-macos-arm64.zip
          )
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"
          for asset in "${expected[@]}"; do
            test -s "$asset"
          done
          git fetch origin --tags --quiet
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            test "$tagged_commit" = "$(git rev-parse HEAD)" || {
              echo "Tag $RELEASE_TAG points at a different commit" >&2
              exit 1
            }
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Explicit tag $RELEASE_TAG does not exist" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already published"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" "${expected[@]}" --verify-tag --generate-notes --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "${expected[@]}" --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG"
          fi
