name: Publish native executables for moon-binstall

on:
  pull_request:
    paths:
      - ".github/workflows/publish-native.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Resolve dependencies
        run: |
          moon update
          moon install
      - name: Build MoonBit native executable
        run: moon build native --target native --release --frozen
      - name: Package raw release asset
        shell: bash
        run: |
          set -euo pipefail
          binaries=$(find _build/native/release/build -type f -name 'native.exe' -print)
          count=$(printf '%s\n' "$binaries" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            printf 'Expected exactly one native.exe, got %s\n' "$count" >&2
            exit 1
          fi
          mkdir -p release
          cp -- "$binaries" "release/dsh-${{ matrix.platform }}"
          chmod 755 "release/dsh-${{ matrix.platform }}"
          test -s "release/dsh-${{ matrix.platform }}"
      - name: Smoke check
        shell: bash
        run: |
          set -euo pipefail
          "./release/dsh-${{ matrix.platform }}" --help
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Publish verified GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(find release -type f | wc -l)" -eq 3
          gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
